# SleepLens dev stack: Postgres + Redis.
# The Django API and the Celery worker run on the host (uv venv with the ML
# stack); containers are provided for the backing services only.
#
#   docker-compose -f compose/dev/docker-compose.yml up -d
#
# Optional containerised web/worker (profile "full") — requires the analysis
# extras installed in the image; see docs/LOCAL_DEVELOPMENT.md.

services:
  db:
    image: postgres:17-alpine
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sleeplens}
      POSTGRES_USER: ${POSTGRES_USER:-sleeplens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sleeplens}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sleeplens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    profiles: ["full"]
    build:
      context: ../..
      target: dev
    env_file:
      - ../../.env
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ../..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: ../..
      target: dev
    env_file:
      - ../../.env
    command: ["celery", "-A", "sleeplens", "worker", "-l", "info"]
    volumes:
      - ../..:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
